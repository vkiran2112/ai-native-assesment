<title>QCI Self-Assessment</title>
<style>
:root{--paper:#fff;--ink:#1d2a30;--muted:#5d6b72;--line:#e2e7ea;--tarp:#1f5f8b;--wheat:#c8a961;--warn:#a1442f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#12181b;--ink:#e6ecef;--muted:#9aa8ae;--line:#27333a;--tarp:#4f93c2;--warn:#e08a74}}
:root[data-theme="dark"]{--paper:#12181b;--ink:#e6ecef;--muted:#9aa8ae;--line:#27333a;--tarp:#4f93c2;--warn:#e08a74}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.lock{width:100%;max-width:340px;padding:24px;text-align:center}
h1{font-size:21px;margin:0 0 6px}
p{color:var(--muted);margin:4px 0 18px}
input{width:100%;text-align:center;letter-spacing:.6em;font-size:28px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--paper);color:var(--ink)}
button{margin-top:14px;width:100%;background:var(--tarp);color:#fff;border:0;border-radius:12px;padding:12px;font:inherit;font-size:17px;font-weight:600}
button:disabled{opacity:.5}
#msg{min-height:1.5em;margin-top:12px;color:var(--muted)}
#msg.err{color:var(--warn)}
button:focus-visible,input:focus-visible{outline:2px solid var(--wheat);outline-offset:2px}
</style>
</head>

  <div id="msg" aria-live="polite"></div>
</form>

const $=id=>document.getElementById(id), msg=$("msg"), pin=$("pin"), go=$("go");
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const FK="qci_lock_fails";
function fails(){ try{ return JSON.parse(localStorage.getItem(FK))||{n:0,until:0}; }catch(e){ return {n:0,until:0}; } }
function setFails(v){ try{ localStorage.setItem(FK,JSON.stringify(v)); }catch(e){} }
async function decrypt(code){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.data));
  return new TextDecoder().decode(pt);
}
function show(html){ document.open(); document.write(html); document.close(); }
async function unlock(code, silent){
  const f=fails(); const wait=Math.ceil((f.until-Date.now())/1000);
  if(wait>0){ msg.className="err"; msg.textContent=`Too many wrong attempts. Try again in ${wait} seconds.`; return; }
  if(!/^\d{6}$/.test(code)){ if(!silent){ msg.className="err"; msg.textContent="The PIN has 6 digits."; } return; }
  go.disabled=true; msg.className=""; msg.textContent="Checking…";
  try{
    const html=await decrypt(code);
    setFails({n:0,until:0});
    try{ sessionStorage.setItem("qci_pin",code); }catch(e){}
    show(html);
  }catch(e){
    go.disabled=false; pin.value="";
    if(silent){ msg.textContent=""; try{ sessionStorage.removeItem("qci_pin"); }catch(x){} return; }
    const n=f.n+1; setFails({n, until: n>=5 ? Date.now()+Math.min(600,30*2**(n-5))*1000 : 0});
    msg.className="err"; msg.textContent = n>=5 ? "Wrong PIN. Too many attempts, so there's a short wait before the next try." : `Wrong PIN. ${5-n} attempt(s) left before a wait.`;
    pin.focus();
  }
}
if(!(window.crypto && crypto.subtle)){ msg.className="err"; msg.textContent="This browser can't unlock the page here. Open it from its https address in Chrome."; go.disabled=true; }
else{
  $("f").addEventListener("submit",e=>{ e.preventDefault(); unlock(pin.value.trim()); });
  pin.addEventListener("input",()=>{ pin.value=pin.value.replace(/\D/g,"").slice(0,6); if(pin.value.length===6) unlock(pin.value); });
  let saved=null; try{ saved=sessionStorage.getItem("qci_pin"); }catch(e){}
  if(saved) unlock(saved,true);
}
})();
